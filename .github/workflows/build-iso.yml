name: Build OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: Build system.iso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm grub-pc-bin grub-common xorriso make mtools

      - name: Build ISO
        run: make clean all

      - name: Verify ISO
        run: |
          test -f system.iso
          file system.iso
          test -s system.iso
          grub-file --is-x86-multiboot kernel.bin

      - name: Collect build outputs
        run: |
          cp kernel.bin system-kernel.bin
          ls -lh system.iso system-kernel.bin

      - name: Build Windows edition
        if: success()
        shell: pwsh
        run: |
          gcc -O2 -s -mwindows windows/gos_win.c -o GOS-Windows.exe -luser32 -lgdi32 -lshell32 -lpsapi
          if (!(Test-Path GOS-Windows.exe)) { throw "GOS-Windows.exe was not created" }

      - name: Upload system.iso
        uses: actions/upload-artifact@v4
        with:
          name: system-iso
          path: |
            system.iso
            system-kernel.bin
          if-no-files-found: error
          retention-days: 30

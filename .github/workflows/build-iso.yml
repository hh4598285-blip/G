name: Build OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: Build system.iso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso make mtools

      - name: Build ISO
        run: make clean all

      - name: Verify BIOS and UEFI ISO
        run: |
          test -f system.iso
          test -s system.iso
          file system.iso
          grub-file --is-x86-multiboot kernel.bin
          xorriso -indev system.iso -find /EFI -type d -print
          xorriso -indev system.iso -find /EFI/BOOT -type f -print
          test -f iso/EFI/BOOT/BOOTX64.EFI
          test -s iso/EFI/BOOT/BOOTX64.EFI

      - name: Collect build outputs
        run: |
          cp kernel.bin system-kernel.bin
          ls -lh system.iso system-kernel.bin

      - name: Upload system.iso
        uses: actions/upload-artifact@v4
        with:
          name: system-iso
          path: |
            system.iso
            system-kernel.bin
          if-no-files-found: error
          retention-days: 30

name: Build OS ISO

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-iso:
    name: Build system.iso
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso make mtools

      - name: Build ISO
        run: |
          set -eux
          make clean all

      - name: Verify kernel
        run: |
          set -eux
          test -s kernel.bin
          grub-file --is-x86-multiboot kernel.bin

      - name: Verify ISO image
        run: |
          set -eux
          test -s system.iso
          file system.iso
          xorriso -indev system.iso -find /boot -type f -print | tee iso-files.txt
          grep -q '/boot/kernel.bin' iso-files.txt

      - name: Verify UEFI boot image
        run: |
          set -eux
          test -s iso/EFI/BOOT/BOOTX64.EFI
          xorriso -indev system.iso -find /EFI/BOOT -type f -print | tee efi-files.txt
          grep -qi 'BOOTX64.EFI' efi-files.txt || {
            echo "UEFI boot image was not embedded in the ISO"
            xorriso -indev system.iso -report_el_torito plain
            exit 1
          }
          xorriso -indev system.iso -report_el_torito plain

      - name: Collect build outputs
        run: |
          set -eux
          cp kernel.bin system-kernel.bin
          ls -lh system.iso system-kernel.bin

      - name: Upload system.iso
        uses: actions/upload-artifact@v4
        with:
          name: system-iso
          path: |
            system.iso
            system-kernel.bin
          if-no-files-found: error
          retention-days: 30
